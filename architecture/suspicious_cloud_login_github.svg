<svg width="680" viewBox="0 0 680 940" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="940" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-size="16" font-weight="600" fill="#2c2c2a">Suspicious cloud login detection</text>

  <!-- BOX 1: User / Attacker — coral -->
  <rect x="100" y="52" width="480" height="90" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">User / Attacker</text>
  <text x="210" y="108" text-anchor="middle" font-size="12" fill="#993C1D">Multiple failed logins</text>
  <text x="210" y="126" text-anchor="middle" font-size="12" fill="#993C1D">Attempts access as bob.finance</text>
  <text x="490" y="117" text-anchor="middle" font-size="11" fill="#D85A30" font-style="italic">Entry point</text>

  <!-- Arrow -->
  <line x1="340" y1="142" x2="340" y2="168" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BOX 2: Microsoft Entra ID — blue -->
  <rect x="100" y="170" width="480" height="90" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Microsoft Entra ID</text>
  <text x="210" y="226" text-anchor="middle" font-size="12" fill="#185FA5">Authentication</text>
  <text x="210" y="244" text-anchor="middle" font-size="12" fill="#185FA5">Identity validation</text>
  <text x="490" y="235" text-anchor="middle" font-size="11" fill="#185FA5" font-style="italic">Identity provider</text>

  <!-- Arrow -->
  <line x1="340" y1="260" x2="340" y2="286" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BOX 3: IAM Controls — purple -->
  <rect x="100" y="288" width="480" height="108" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">IAM controls</text>
  <text x="210" y="344" text-anchor="middle" font-size="12" fill="#534AB7">MFA challenge</text>
  <text x="210" y="362" text-anchor="middle" font-size="12" fill="#534AB7">RBAC (group-based access)</text>
  <text x="210" y="380" text-anchor="middle" font-size="12" fill="#534AB7">Least privilege enforcement</text>
  <text x="490" y="362" text-anchor="middle" font-size="11" fill="#534AB7" font-style="italic">Access enforcement</text>

  <!-- Arrow -->
  <line x1="340" y1="396" x2="340" y2="422" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BOX 4: Sign-in & Audit Logs — teal -->
  <rect x="100" y="424" width="480" height="126" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sign-in &amp; audit logs</text>
  <text x="210" y="480" text-anchor="middle" font-size="12" fill="#0F6E56">Timestamp</text>
  <text x="210" y="498" text-anchor="middle" font-size="12" fill="#0F6E56">User identity</text>
  <text x="210" y="516" text-anchor="middle" font-size="12" fill="#0F6E56">IP address / Location</text>
  <text x="210" y="534" text-anchor="middle" font-size="12" fill="#0F6E56">Success / Failure + MFA result</text>
  <text x="490" y="507" text-anchor="middle" font-size="11" fill="#0F6E56" font-style="italic">Telemetry source</text>

  <!-- Arrow -->
  <line x1="340" y1="550" x2="340" y2="576" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BOX 5: SIEM / Detection Logic — amber -->
  <rect x="100" y="578" width="480" height="90" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">SIEM / Detection logic</text>
  <text x="210" y="634" text-anchor="middle" font-size="12" fill="#854F0B">Failed logins → success pattern</text>
  <text x="210" y="652" text-anchor="middle" font-size="12" fill="#854F0B">Suspicious behaviour detection</text>
  <text x="490" y="643" text-anchor="middle" font-size="11" fill="#854F0B" font-style="italic">Threat detection</text>

  <!-- Arrow -->
  <line x1="340" y1="668" x2="340" y2="694" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BOX 6: Security Response — red -->
  <rect x="100" y="696" width="480" height="108" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="340" y="728" text-anchor="middle" font-size="14" font-weight="600" fill="#791F1F">Security response</text>
  <text x="210" y="752" text-anchor="middle" font-size="12" fill="#A32D2D">Investigate activity</text>
  <text x="210" y="770" text-anchor="middle" font-size="12" fill="#A32D2D">Reset credentials</text>
  <text x="210" y="788" text-anchor="middle" font-size="12" fill="#A32D2D">Review access permissions</text>
  <text x="490" y="770" text-anchor="middle" font-size="11" fill="#A32D2D" font-style="italic">Incident response</text>

  <!-- Legend -->
  <rect x="100" y="840" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="118" y="851" font-size="11" fill="#444441">Attacker</text>
  <rect x="185" y="840" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="203" y="851" font-size="11" fill="#444441">Identity</text>
  <rect x="262" y="840" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="280" y="851" font-size="11" fill="#444441">Access control</text>
  <rect x="375" y="840" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="393" y="851" font-size="11" fill="#444441">Logging</text>
  <rect x="447" y="840" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="465" y="851" font-size="11" fill="#444441">Detection</text>
  <rect x="527" y="840" width="12" height="12" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="545" y="851" font-size="11" fill="#444441">Response</text>

  <!-- Footer -->
  <text x="340" y="910" text-anchor="middle" font-size="10" fill="#B4B2A9">Suspicious Cloud Login Detection · Security Architecture</text>
</svg>
